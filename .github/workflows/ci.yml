name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and test with H2
        run: mvn -B clean test

  mysql-smoke-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: logistics_network
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application
        run: mvn -B -DskipTests package

      - name: Start Spring Boot against MySQL
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/logistics_network?createDatabaseIfNotExist=true
          DB_USERNAME: root
          DB_PASSWORD: root
          SERVER_PORT: 8080
        run: |
          java -jar target/logistics-network-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          echo $! > app.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/api/warehouses > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Export Hibernate-generated schema
        run: |
          mysqldump             --host=127.0.0.1             --port=3306             --user=root             --password=root             --no-data             --skip-comments             logistics_network > logistics_schema.sql

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: logistics-schema
          path: logistics_schema.sql

      - name: Print application log on failure
        if: failure()
        run: cat app.log || true
